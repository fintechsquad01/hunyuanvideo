name: Build Turkey Composite

on:
  push:
    branches: [claude/zenshapes-strategy-analysis-xZzbe]
    paths:
      - .github/workflows/build_turkey_composite.yml
      - world-cup-loops/pieces/wc_turkey_dream/build_long_form.py
      - world-cup-loops/pieces/wc_turkey_dream/audio_synth.py
      - world-cup-loops/pieces/wc_turkey_dream/render_titles.py
      - world-cup-loops/pieces/wc_turkey_dream/scenes.py
      - world-cup-loops/pieces/wc_turkey_dream/download_scenes.sh
      - world-cup-loops/pieces/wc_turkey_dream/job_urls.json
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/zenshapes-strategy-analysis-xZzbe
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: pip install --quiet pillow numpy scipy

      - name: Run pipeline (capture everything)
        id: pipeline
        continue-on-error: true
        run: |
          set -x
          cd world-cup-loops
          mkdir -p output
          {
            echo "=== ENV ==="
            uname -a
            python3 --version
            ffmpeg -version | head -1
            echo
            echo "=== DOWNLOAD ==="
            bash pieces/wc_turkey_dream/download_scenes.sh
            echo
            echo "=== RAW DIR ==="
            ls -lh output/wc_turkey_raw/ || true
            echo
            echo "=== COMPOSITE ==="
            python pieces/wc_turkey_dream/build_long_form.py
            echo
            echo "=== OUTPUT DIR ==="
            ls -lh output/ || true
            echo
            echo "=== FFPROBE ==="
            ffprobe -v error -show_format -show_streams output/wc_turkey_dream.mp4 || true
          } > output/build.log 2>&1
          echo "PIPELINE_EXIT=$?"
          cat output/build.log

      - name: Always commit build.log + MP4 if it exists
        if: always()
        run: |
          set -x
          cd world-cup-loops
          ls -lh output/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Force-add the log even if .gitignore excludes output
          git add -f output/build.log || true
          # Add the MP4 if present
          [ -f output/wc_turkey_dream.mp4 ] && git add -f output/wc_turkey_dream.mp4 || true
          git status
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Actions: build log + MP4 if produced [skip ci]"
            git push origin HEAD:claude/zenshapes-strategy-analysis-xZzbe
          fi
