<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Anton'; src: url('file:///home/user/hunyuanvideo/world-cup-loops/design/project/fonts/Anton-Regular.ttf') format('truetype'); font-display: block; }
@font-face { font-family: 'Roboto Condensed'; font-weight: 700; src: url('file:///home/user/hunyuanvideo/world-cup-loops/design/project/fonts/RobotoCondensed-Bold.ttf') format('truetype'); font-display: block; }
@font-face { font-family: 'Inter'; font-weight: 700; src: url('file:///usr/share/fonts/opentype/inter/Inter-Bold.otf') format('opentype'); font-display: block; }
@font-face { font-family: 'Inter'; font-weight: 600; src: url('file:///usr/share/fonts/opentype/inter/Inter-SemiBold.otf') format('opentype'); font-display: block; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, sans-serif; color: #fff; }
body { background: linear-gradient(180deg, #0d2818 0%, #08180e 55%, #020a05 100%); position: relative; }

.watermark { position: absolute; top: 28px; left: 28px; font-family: Inter; font-weight: 700; font-size: 28px; color: rgba(255,255,255,0.65); letter-spacing: -0.01em; z-index: 100; }
.round-chip { position: absolute; top: 28px; right: 28px; font-family: 'Roboto Condensed'; font-weight: 700; font-size: 22px; color: #fff; letter-spacing: 0.1em; background: #0f9d58; padding: 10px 18px; border-radius: 999px; z-index: 100; }

.hook-band { position: absolute; top: 90px; left: 0; right: 0; display: flex; justify-content: center; }
.hook-text { background: rgba(0,0,0,0.65); padding: 18px 36px; font-family: Anton; font-size: 64px; color: #fff; letter-spacing: -0.02em; }

.cta-band { position: absolute; bottom: 0; left: 0; right: 0; height: 7%; background: rgba(0,0,0,0.78); display: flex; align-items: center; justify-content: center; }
.cta-text { font-family: Anton; font-size: 52px; color: #ffd400; letter-spacing: -0.02em; }

/* Chart area */
.chart { position: absolute; left: 0; right: 0; top: 240px; bottom: 220px; }
.year-label { position: absolute; bottom: 0; font-family: 'Roboto Condensed'; font-weight: 700; font-size: 22px; color: #8aa195; letter-spacing: 0.05em; transform: translateX(-50%); }
.elo-label { position: absolute; left: 0; font-family: 'Roboto Condensed'; font-weight: 700; font-size: 18px; color: #5a6f64; letter-spacing: 0.05em; transform: translateY(-50%); }

svg.chart-svg { width: 100%; height: 100%; }

.marble-label {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 8px;
  pointer-events: none;
}
.marble-circle {
  width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 3px solid rgba(255,255,255,0.85);
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  font-family: 'Inter'; font-weight: 700; font-size: 18px; color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.7);
  flex-shrink: 0;
}

.payoff { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(0,0,0,0.86); opacity: 0; padding: 0 48px; }
.payoff.show { display: flex; }
.payoff-title { font-family: Anton; font-size: 110px; color: #fff; letter-spacing: -0.03em; line-height: 0.95; margin-bottom: 16px; text-align: center; }
.payoff-sub { font-family: Anton; font-size: 56px; color: #ffd400; letter-spacing: -0.02em; margin-bottom: 56px; }
.podium { display: flex; flex-direction: column; gap: 24px; align-items: flex-start; }
.podium-row { display: flex; align-items: center; gap: 24px; font-family: Anton; }
.podium-rank { font-size: 88px; color: #8aa195; letter-spacing: -0.02em; min-width: 84px; text-align: right; }
.podium-rank.gold { color: #ffd400; }
.podium-name { font-size: 88px; color: #fff; letter-spacing: -0.02em; min-width: 220px; }
.podium-gain { font-size: 64px; color: #ff4d4d; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="watermark">pitch.predict</div>
<div class="round-chip" id="round-chip">WC 2026 · ELO COLLAPSE</div>

<div class="hook-band" id="hook-band">
  <div class="hook-text" id="hook-text">5 GIANTS WHO FELL</div>
</div>

<div class="chart">
  <svg class="chart-svg" id="svg" viewBox="0 0 1080 1460" preserveAspectRatio="none"></svg>
  <!-- Year labels at bottom inserted by JS -->
  <div id="year-labels"></div>
  <!-- Marble heads inserted by JS -->
  <div id="marbles"></div>
</div>

<div class="cta-band">
  <div class="cta-text" id="cta-text">CAN THEY STILL WIN?</div>
</div>

<div class="payoff" id="payoff">
  <div class="payoff-title" id="payoff-title">NORWAY</div>
  <div class="payoff-sub">+331 ELO · CLIMBED 55 RANKS</div>
  <div class="podium" id="podium"></div>
</div>

<script>
const FPS = 30;
const TOTAL = 540;  // 18s @ 30fps
const INTRO_END = 30;
const RACE_START = 30;
const RACE_END = 450;       // race takes 14s
const PAYOFF_START = 460;

// Trajectory data is injected by the renderer (window.TRAJECTORIES)
// Format: { team_code: [{date, elo, rank}, ...], ... }

const TEAM_META = {
  GER: { color: '#1a1a1a', name: 'GERMANY' },
  BRA: { color: '#ffd400', name: 'BRAZIL' },
  BIH: { color: '#002395', name: 'BOSNIA' },
  GHA: { color: '#ce1126', name: 'GHANA' },
  SWE: { color: '#005fa0', name: 'SWEDEN' },
};

// Chart bounds (in SVG viewBox units 0-1080 wide, 0-1460 tall)
const W = 1080, H = 1460;
const PADDING_L = 80, PADDING_R = 100, PADDING_T = 40, PADDING_B = 60;
const CHART_W = W - PADDING_L - PADDING_R;
const CHART_H = H - PADDING_T - PADDING_B;

// Elo bounds across all 10 teams
let MIN_ELO = Infinity, MAX_ELO = -Infinity;
function computeBounds() {
  for (const code in window.TRAJECTORIES) {
    for (const p of window.TRAJECTORIES[code]) {
      if (p.elo < MIN_ELO) MIN_ELO = p.elo;
      if (p.elo > MAX_ELO) MAX_ELO = p.elo;
    }
  }
  // Pad
  MIN_ELO = Math.floor((MIN_ELO - 50) / 50) * 50;
  MAX_ELO = Math.ceil((MAX_ELO + 50) / 50) * 50;
}

function xFor(i, n) {
  // i is index 0..n-1 in the trajectory
  return PADDING_L + (i / (n - 1)) * CHART_W;
}
function yForElo(elo) {
  const t = (elo - MIN_ELO) / (MAX_ELO - MIN_ELO);
  return PADDING_T + (1 - t) * CHART_H;
}

function init() {
  computeBounds();
  const svg = document.getElementById('svg');
  svg.innerHTML = '';

  // Grid lines for Elo levels
  for (let elo = MIN_ELO; elo <= MAX_ELO; elo += 200) {
    const y = yForElo(elo);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', PADDING_L);
    line.setAttribute('x2', W - PADDING_R);
    line.setAttribute('y1', y);
    line.setAttribute('y2', y);
    line.setAttribute('stroke', 'rgba(255,255,255,0.06)');
    line.setAttribute('stroke-width', 1);
    svg.appendChild(line);
    // Label
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', PADDING_L - 8);
    label.setAttribute('y', y + 6);
    label.setAttribute('text-anchor', 'end');
    label.setAttribute('fill', 'rgba(218, 230, 223, 0.4)');
    label.setAttribute('font-family', 'Roboto Condensed');
    label.setAttribute('font-weight', '700');
    label.setAttribute('font-size', '18');
    label.textContent = String(elo);
    svg.appendChild(label);
  }

  // Year labels at bottom (one every ~2 years)
  const labelsDiv = document.getElementById('year-labels');
  labelsDiv.innerHTML = '';
  const sampleTeam = Object.keys(window.TRAJECTORIES)[0];
  const traj = window.TRAJECTORIES[sampleTeam];
  const yearSet = new Set();
  for (let i = 0; i < traj.length; i++) {
    const y = traj[i].date.slice(0, 4);
    if (!yearSet.has(y) && parseInt(y) % 2 === 0) {
      yearSet.add(y);
      const el = document.createElement('div');
      el.className = 'year-label';
      const xPx = (xFor(i, traj.length) / W) * 100;
      el.style.left = `${xPx}%`;
      el.textContent = y;
      labelsDiv.appendChild(el);
    }
  }

  // Create paths and marbles for each team
  for (const code in window.TRAJECTORIES) {
    const meta = TEAM_META[code];
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('id', `path-${code}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', meta.color);
    path.setAttribute('stroke-width', 5);
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('opacity', 0.92);
    path.setAttribute('filter', 'drop-shadow(0 2px 8px rgba(0,0,0,0.5))');
    svg.appendChild(path);
  }

  // Marble heads (create separately, positioned absolute)
  const marblesDiv = document.getElementById('marbles');
  marblesDiv.innerHTML = '';
  for (const code in window.TRAJECTORIES) {
    const meta = TEAM_META[code];
    const wrapper = document.createElement('div');
    wrapper.className = 'marble-label';
    wrapper.id = `marble-${code}`;
    const circle = document.createElement('div');
    circle.className = 'marble-circle';
    circle.style.background = meta.color;
    circle.textContent = code;
    wrapper.appendChild(circle);
    marblesDiv.appendChild(wrapper);
  }
}

function smoothPathD(points) {
  // Cardinal spline (Catmull-Rom-ish smoothing)
  if (points.length < 2) return '';
  let d = `M ${points[0][0]} ${points[0][1]}`;
  for (let i = 1; i < points.length; i++) {
    const p0 = points[i - 1];
    const p1 = points[i];
    if (i === 1) {
      d += ` L ${p1[0]} ${p1[1]}`;
    } else {
      d += ` L ${p1[0]} ${p1[1]}`;
    }
  }
  return d;
}

window.renderFrame = function(frame) {
  const chartEl = document.querySelector('.chart');
  const chartRect = chartEl.getBoundingClientRect();

  // Race progress (0..1) across the trajectory
  let progress;
  if (frame < RACE_START) progress = 0;
  else if (frame >= RACE_END) progress = 1;
  else progress = (frame - RACE_START) / (RACE_END - RACE_START);
  // Ease
  progress = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;

  // For each team: clip the path to the current progress + position marble
  for (const code in window.TRAJECTORIES) {
    const traj = window.TRAJECTORIES[code];
    const n = traj.length;
    const idxFloat = progress * (n - 1);
    const i = Math.floor(idxFloat);
    const frac = idxFloat - i;

    // Build path up to current progress
    const points = [];
    for (let k = 0; k <= i; k++) {
      points.push([xFor(k, n), yForElo(traj[k].elo)]);
    }
    if (frac > 0 && i + 1 < n) {
      const xNow = xFor(i, n) + frac * (xFor(i + 1, n) - xFor(i, n));
      const eloNow = traj[i].elo + frac * (traj[i + 1].elo - traj[i].elo);
      points.push([xNow, yForElo(eloNow)]);
    }
    document.getElementById(`path-${code}`).setAttribute('d', smoothPathD(points));

    // Marble position (in viewBox space, convert to %)
    const lastPt = points[points.length - 1] || [PADDING_L, yForElo(traj[0].elo)];
    const xPct = (lastPt[0] / W) * 100;
    const yPct = (lastPt[1] / H) * 100;
    const marble = document.getElementById(`marble-${code}`);
    marble.style.left = `${xPct}%`;
    marble.style.top = `${yPct}%`;
  }

  // Hook fade out after first 2.5s
  const hook = document.getElementById('hook-band');
  if (frame > 75) {
    hook.style.opacity = Math.max(0, 1 - (frame - 75) / 30);
  } else {
    hook.style.opacity = 1;
  }

  // CTA fade in early
  const cta = document.querySelector('.cta-band');
  cta.style.opacity = Math.min(1, Math.max(0, (frame - 30) / 20));

  // Payoff overlay
  const payoff = document.getElementById('payoff');
  if (frame >= PAYOFF_START) {
    payoff.classList.add('show');
    payoff.style.opacity = Math.min(1, (frame - PAYOFF_START) / 14);
    // Build podium content (only once)
    if (!payoff.dataset.built) {
      const podium = document.getElementById('podium');
      podium.innerHTML = '';
      const ranked = [
        { code: 'GER', gain: -185, rankClimb: -9 },
        { code: 'BRA', gain: -129, rankClimb: -4 },
        { code: 'BIH', gain: -126, rankClimb: -30 },
        { code: 'GHA', gain: -110, rankClimb: -26 },
        { code: 'SWE', gain:  -97, rankClimb: -23 },
      ];
      ranked.forEach((row, i) => {
        const div = document.createElement('div');
        div.className = 'podium-row';
        div.innerHTML = `
          <div class="podium-rank ${i === 0 ? 'gold' : ''}">#${i + 1}</div>
          <div class="podium-name">${row.code}</div>
          <div class="podium-gain">${row.gain >= 0 ? '+' : ''}${row.gain}</div>
        `;
        podium.appendChild(div);
      });
      payoff.dataset.built = '1';
    }
  } else {
    payoff.classList.remove('show');
    payoff.style.opacity = 0;
  }
};

// Boot: wait for TRAJECTORIES to be set, then init
window.boot = function() {
  init();
  window.renderFrame(0);
};
</script>
</body>
</html>
