<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Motion timing</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background: var(--pp-bg); color: var(--pp-fg); font-family: var(--pp-ff-body); }
  body { padding: 20px; box-sizing: border-box; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .swatch { border-radius: 8px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; min-height: 120px; box-shadow: var(--pp-shadow-card); }
  .swatch .name { font: 700 14px/1 var(--pp-ff-body); letter-spacing: 0.04em; text-transform: uppercase; }
  .swatch .hex { font: 600 12px/1 var(--pp-ff-num); letter-spacing: 0.06em; opacity: 0.85; }
  .swatch .role { font: 500 11px/1.25 var(--pp-ff-body); opacity: 0.75; margin-top: 8px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding: 4px 10px; border-radius: 999px; font: 700 11px/1 var(--pp-ff-num); letter-spacing: 0.08em; text-transform: uppercase; }
  .specimen { background: var(--pp-bg-elev); border-radius: 8px; padding: 18px; }
  .label { font: 500 10px/1 var(--pp-ff-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--pp-fg-3); margin-bottom: 8px; }
  .meta { font: 500 11px/1.2 var(--pp-ff-num); color: var(--pp-fg-3); margin-top: 6px; letter-spacing: 0.04em; }
</style>
</head>
<body>

<div class="col">
  <div style="display:grid; grid-template-columns: 110px 1fr 120px; gap: 10px 16px; align-items:center;">
    <span class="pp-fine">120ms</span> <div style="height:6px; background: var(--pp-line); border-radius: 4px; position:relative;"><div style="width: 12%; height:100%; background: var(--pp-green-bright); border-radius:4px;"></div></div> <span class="pp-fine" style="color: var(--pp-fg-3);">--pp-d-fast · hover</span>
    <span class="pp-fine">240ms</span> <div style="height:6px; background: var(--pp-line); border-radius: 4px; position:relative;"><div style="width: 24%; height:100%; background: var(--pp-green); border-radius:4px;"></div></div> <span class="pp-fine" style="color: var(--pp-fg-3);">--pp-d-base · default</span>
    <span class="pp-fine">500ms</span> <div style="height:6px; background: var(--pp-line); border-radius: 4px; position:relative;"><div style="width: 50%; height:100%; background: var(--pp-yellow); border-radius:4px;"></div></div> <span class="pp-fine" style="color: var(--pp-fg-3);">intro stinger</span>
    <span class="pp-fine">600ms</span> <div style="height:6px; background: var(--pp-line); border-radius: 4px; position:relative;"><div style="width: 60%; height:100%; background: var(--pp-yellow); border-radius:4px;"></div></div> <span class="pp-fine" style="color: var(--pp-fg-3);">outro stinger</span>
  </div>
  <div class="meta">Easing — out: cubic-bezier(.16,1,.3,1)  ·  bounce-in: cubic-bezier(.34,1.56,.64,1)</div>
</div>
</body></html>
