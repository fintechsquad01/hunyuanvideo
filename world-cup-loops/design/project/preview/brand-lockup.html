<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Lockup</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background: var(--pp-bg); color: var(--pp-fg); font-family: var(--pp-ff-body); }
  body { padding: 20px; box-sizing: border-box; }
  .row { display:flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .col { display:flex; flex-direction: column; gap: 14px; }
  .meta { font: 500 11px/1.2 var(--pp-ff-num); color: var(--pp-fg-3); margin-top: 6px; letter-spacing: 0.04em; }
  .label { font: 500 10px/1 var(--pp-ff-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--pp-fg-3); margin-bottom: 6px; }
</style>
</head>
<body>

<div class="col" style="gap: 14px;">
  <div style="background: #0a1a14; padding: 18px; border-radius: 8px;">
    <img src="../assets/logo-lockup.svg" style="width: 100%; max-width: 520px; height: auto;"/>
  </div>
  <div style="background: #ffffff; padding: 18px; border-radius: 8px;">
    <img src="../assets/logo-lockup-light.svg" style="width: 100%; max-width: 520px; height: auto;"/>
  </div>
</div>
<div class="meta">Horizontal: icon + Anton wordmark, tight tracking, pitch-green dot as separator. Light + dark variants.</div>
</body></html>
