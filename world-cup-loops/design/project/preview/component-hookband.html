<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Hook / CTA bands</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background: var(--pp-bg); color: var(--pp-fg); font-family: var(--pp-ff-body); }
  body { padding: 20px; box-sizing: border-box; }
  .row { display:flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .col { display:flex; flex-direction: column; gap: 14px; }
  .meta { font: 500 11px/1.2 var(--pp-ff-num); color: var(--pp-fg-3); margin-top: 6px; letter-spacing: 0.04em; }
  .label { font: 500 10px/1 var(--pp-ff-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--pp-fg-3); margin-bottom: 6px; }
</style>
</head>
<body>

<div class="col">
  <div class="label">HOOK BAND · top 7%</div>
  <div style="background: var(--pp-overlay-band); padding: 16px 20px; border-radius: 4px;">
    <div class="pp-hook" style="font-size: 32px;">WHO SURVIVES GROUP D?</div>
  </div>
  <div class="label" style="margin-top: 6px;">CTA BAND · bottom 7%</div>
  <div style="background: var(--pp-overlay-band); padding: 16px 20px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">
    <div class="pp-hook" style="font-size: 26px;">COMMENT YOUR PICK</div>
    <span class="pp-badge" style="color: var(--pp-yellow);">→ FOLLOW</span>
  </div>
</div>
</body></html>
