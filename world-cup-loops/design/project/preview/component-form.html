<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Form input</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background: var(--pp-bg); color: var(--pp-fg); font-family: var(--pp-ff-body); }
  body { padding: 20px; box-sizing: border-box; }
  .row { display:flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .col { display:flex; flex-direction: column; gap: 14px; }
  .meta { font: 500 11px/1.2 var(--pp-ff-num); color: var(--pp-fg-3); margin-top: 6px; letter-spacing: 0.04em; }
  .label { font: 500 10px/1 var(--pp-ff-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--pp-fg-3); margin-bottom: 6px; }
</style>
</head>
<body>

<div class="col" style="max-width: 460px;">
  <div>
    <div class="label">EMAIL SIGNUP</div>
    <div style="display:flex; gap: 8px;">
      <input type="email" placeholder="you@team.com" style="flex:1; background: var(--pp-bg-elev); border: 1px solid var(--pp-line-strong); color: var(--pp-fg); padding: 14px 16px; font: 500 16px var(--pp-ff-body); border-radius: 4px; outline: none;"/>
      <button class="pp-cta">Subscribe</button>
    </div>
  </div>
  <div>
    <div class="label">FOCUS STATE</div>
    <input type="email" value="hola@es.fc" style="width: 100%; box-sizing: border-box; background: var(--pp-bg-elev); border: 2px solid var(--pp-green-bright); color: var(--pp-fg); padding: 13px 16px; font: 500 16px var(--pp-ff-body); border-radius: 4px; outline: none;"/>
  </div>
</div>
</body></html>
