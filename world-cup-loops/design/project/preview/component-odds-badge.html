<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Odds badge</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background: var(--pp-bg); color: var(--pp-fg); font-family: var(--pp-ff-body); }
  body { padding: 20px; box-sizing: border-box; }
  .row { display:flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .col { display:flex; flex-direction: column; gap: 14px; }
  .meta { font: 500 11px/1.2 var(--pp-ff-num); color: var(--pp-fg-3); margin-top: 6px; letter-spacing: 0.04em; }
  .label { font: 500 10px/1 var(--pp-ff-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--pp-fg-3); margin-bottom: 6px; }
</style>
</head>
<body>

<div class="row" style="gap: 14px;">
  <div style="background: var(--pp-overlay-band); padding: 10px 14px; border-radius: 4px; display: inline-flex; flex-direction: column; gap: 2px;">
    <span class="pp-fine" style="color: var(--pp-fg-3);">POLYMARKET</span>
    <span class="pp-num" style="font-size: 32px;">18%</span>
  </div>
  <div style="background: var(--pp-overlay-band); padding: 10px 14px; border-radius: 4px; display: inline-flex; flex-direction: column; gap: 2px;">
    <span class="pp-fine" style="color: var(--pp-fg-3);">PLINKO</span>
    <span class="pp-num" style="font-size: 32px;">20%</span>
  </div>
  <div style="background: var(--pp-overlay-band); padding: 10px 14px; border-radius: 4px; display: inline-flex; flex-direction: column; gap: 2px;">
    <span class="pp-fine" style="color: var(--pp-fg-3);">ELO</span>
    <span class="pp-num" style="font-size: 32px;">1842</span>
  </div>
</div>
<div class="meta">Top-right of every video. Roboto Condensed Bold, tabular-nums.</div>
</body></html>
