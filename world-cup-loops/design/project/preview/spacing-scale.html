<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background: var(--pp-bg); color: var(--pp-fg); font-family: var(--pp-ff-body); }
  body { padding: 20px; box-sizing: border-box; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .swatch { border-radius: 8px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; min-height: 120px; box-shadow: var(--pp-shadow-card); }
  .swatch .name { font: 700 14px/1 var(--pp-ff-body); letter-spacing: 0.04em; text-transform: uppercase; }
  .swatch .hex { font: 600 12px/1 var(--pp-ff-num); letter-spacing: 0.06em; opacity: 0.85; }
  .swatch .role { font: 500 11px/1.25 var(--pp-ff-body); opacity: 0.75; margin-top: 8px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding: 4px 10px; border-radius: 999px; font: 700 11px/1 var(--pp-ff-num); letter-spacing: 0.08em; text-transform: uppercase; }
  .specimen { background: var(--pp-bg-elev); border-radius: 8px; padding: 18px; }
  .label { font: 500 10px/1 var(--pp-ff-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--pp-fg-3); margin-bottom: 8px; }
  .meta { font: 500 11px/1.2 var(--pp-ff-num); color: var(--pp-fg-3); margin-top: 6px; letter-spacing: 0.04em; }
</style>
</head>
<body>

<div style="display:flex; align-items:flex-end; gap:10px;">
  
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="background: var(--pp-green); width: 22px; height: 4px; border-radius: 2px;"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">4</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="background: var(--pp-green); width: 22px; height: 8px; border-radius: 2px;"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">8</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="background: var(--pp-green); width: 22px; height: 12px; border-radius: 2px;"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">12</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="background: var(--pp-green); width: 22px; height: 16px; border-radius: 2px;"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">16</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="background: var(--pp-green); width: 22px; height: 20px; border-radius: 2px;"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">20</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="background: var(--pp-green); width: 22px; height: 24px; border-radius: 2px;"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">24</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="background: var(--pp-green); width: 22px; height: 32px; border-radius: 2px;"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">32</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="background: var(--pp-green); width: 22px; height: 40px; border-radius: 2px;"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">40</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="background: var(--pp-green); width: 22px; height: 48px; border-radius: 2px;"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">48</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="background: var(--pp-green); width: 22px; height: 64px; border-radius: 2px;"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">64</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="background: var(--pp-green); width: 22px; height: 80px; border-radius: 2px;"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">80</div>
    </div>
</div>
<div class="meta">4px base · multiples of 4 · CSS vars --pp-s-1 through --pp-s-20</div>
</body></html>
