<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Lower third</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background: var(--pp-bg); color: var(--pp-fg); font-family: var(--pp-ff-body); }
  body { padding: 20px; box-sizing: border-box; }
  .row { display:flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .col { display:flex; flex-direction: column; gap: 14px; }
  .meta { font: 500 11px/1.2 var(--pp-ff-num); color: var(--pp-fg-3); margin-top: 6px; letter-spacing: 0.04em; }
  .label { font: 500 10px/1 var(--pp-ff-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--pp-fg-3); margin-bottom: 6px; }
</style>
</head>
<body>

<div style="background: linear-gradient(90deg, #11261b 0%, rgba(17,38,27,0) 100%); border-left: 4px solid var(--pp-yellow); padding: 14px 18px; border-radius: 0 4px 4px 0;">
  <div class="pp-fine" style="color: var(--pp-yellow); margin-bottom: 4px;">ROUND OF 32</div>
  <div style="font: 800 26px/1 var(--pp-ff-hook); text-transform: uppercase; letter-spacing: -0.01em; color: var(--pp-fg);">Group D — Predictor</div>
</div>
<div class="meta">Animated title bars: "Round of 32", "Top Scorer", "Group D" — green gradient + yellow accent bar.</div>
</body></html>
