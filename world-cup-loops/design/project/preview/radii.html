<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background: var(--pp-bg); color: var(--pp-fg); font-family: var(--pp-ff-body); }
  body { padding: 20px; box-sizing: border-box; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .swatch { border-radius: 8px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; min-height: 120px; box-shadow: var(--pp-shadow-card); }
  .swatch .name { font: 700 14px/1 var(--pp-ff-body); letter-spacing: 0.04em; text-transform: uppercase; }
  .swatch .hex { font: 600 12px/1 var(--pp-ff-num); letter-spacing: 0.06em; opacity: 0.85; }
  .swatch .role { font: 500 11px/1.25 var(--pp-ff-body); opacity: 0.75; margin-top: 8px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding: 4px 10px; border-radius: 999px; font: 700 11px/1 var(--pp-ff-num); letter-spacing: 0.08em; text-transform: uppercase; }
  .specimen { background: var(--pp-bg-elev); border-radius: 8px; padding: 18px; }
  .label { font: 500 10px/1 var(--pp-ff-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--pp-fg-3); margin-bottom: 8px; }
  .meta { font: 500 11px/1.2 var(--pp-ff-num); color: var(--pp-fg-3); margin-top: 6px; letter-spacing: 0.04em; }
</style>
</head>
<body>

<div class="row" style="gap: 14px; align-items:flex-end;">
  
    <div style="display:flex; flex-direction:column; gap: 6px; align-items:center;">
      <div style="background: var(--pp-bg-elev); border: 1px solid var(--pp-line-strong); width: 110px; height: 70px; border-radius: 2px; display:flex; align-items:center; justify-content:center; font: 700 18px var(--pp-ff-num); color: var(--pp-fg-2);">2</div>
      <div class="pp-fine" style="color: var(--pp-fg-3);">Badges / odds chips</div>
    </div>
    <div style="display:flex; flex-direction:column; gap: 6px; align-items:center;">
      <div style="background: var(--pp-bg-elev); border: 1px solid var(--pp-line-strong); width: 110px; height: 70px; border-radius: 4px; display:flex; align-items:center; justify-content:center; font: 700 18px var(--pp-ff-num); color: var(--pp-fg-2);">4</div>
      <div class="pp-fine" style="color: var(--pp-fg-3);">Buttons / CTAs</div>
    </div>
    <div style="display:flex; flex-direction:column; gap: 6px; align-items:center;">
      <div style="background: var(--pp-bg-elev); border: 1px solid var(--pp-line-strong); width: 110px; height: 70px; border-radius: 8px; display:flex; align-items:center; justify-content:center; font: 700 18px var(--pp-ff-num); color: var(--pp-fg-2);">8</div>
      <div class="pp-fine" style="color: var(--pp-fg-3);">Cards</div>
    </div>
    <div style="display:flex; flex-direction:column; gap: 6px; align-items:center;">
      <div style="background: var(--pp-bg-elev); border: 1px solid var(--pp-line-strong); width: 110px; height: 70px; border-radius: 12px; display:flex; align-items:center; justify-content:center; font: 700 18px var(--pp-ff-num); color: var(--pp-fg-2);">12</div>
      <div class="pp-fine" style="color: var(--pp-fg-3);">Hero modules</div>
    </div>
    <div style="display:flex; flex-direction:column; gap: 6px; align-items:center;">
      <div style="background: var(--pp-bg-elev); border: 1px solid var(--pp-line-strong); width: 110px; height: 70px; border-radius: 999px; display:flex; align-items:center; justify-content:center; font: 700 18px var(--pp-ff-num); color: var(--pp-fg-2);">pill</div>
      <div class="pp-fine" style="color: var(--pp-fg-3);">Round indicator · live dots</div>
    </div>
</div>
</body></html>
