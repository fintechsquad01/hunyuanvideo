<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Winner banner</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background: var(--pp-bg); color: var(--pp-fg); font-family: var(--pp-ff-body); }
  body { padding: 20px; box-sizing: border-box; }
  .row { display:flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .col { display:flex; flex-direction: column; gap: 14px; }
  .meta { font: 500 11px/1.2 var(--pp-ff-num); color: var(--pp-fg-3); margin-top: 6px; letter-spacing: 0.04em; }
  .label { font: 500 10px/1 var(--pp-ff-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--pp-fg-3); margin-bottom: 6px; }
</style>
</head>
<body>

<div style="background: linear-gradient(180deg, #AA151B 0%, #7a0e13 100%); padding: 18px 24px; border-bottom: 3px solid var(--pp-yellow); border-radius: 4px 4px 0 0;">
  <div class="pp-banner" style="font-size: 36px; color: var(--pp-yellow); letter-spacing: 0.04em;">WINNER</div>
  <div class="pp-winner" style="font-size: 84px; line-height: 0.92;">SPAIN</div>
</div>
<div class="meta">Country-color backdrop · Bebas WINNER caption in yellow · Anton team name with glow · 2-3px yellow bottom border</div>
</body></html>
