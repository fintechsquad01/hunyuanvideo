<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Icon</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background: var(--pp-bg); color: var(--pp-fg); font-family: var(--pp-ff-body); }
  body { padding: 20px; box-sizing: border-box; }
  .row { display:flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .col { display:flex; flex-direction: column; gap: 14px; }
  .meta { font: 500 11px/1.2 var(--pp-ff-num); color: var(--pp-fg-3); margin-top: 6px; letter-spacing: 0.04em; }
  .label { font: 500 10px/1 var(--pp-ff-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--pp-fg-3); margin-bottom: 6px; }
</style>
</head>
<body>

<div class="row" style="gap: 18px; align-items:flex-end;">
  <div style="display:flex; flex-direction:column; gap:6px; align-items:center;">
    <img src="../assets/logo-icon.svg" width="120" height="120"/>
    <div class="pp-fine" style="color: var(--pp-fg-3);">PRIMARY · 1024-safe</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:6px; align-items:center;">
    <div style="background: #0a1a14; padding: 6px; border-radius: 16px;"><img src="../assets/logo-icon-mono.svg" width="86" height="86" style="filter: none;"/></div>
    <div class="pp-fine" style="color: var(--pp-fg-3);">MONO LIGHT</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:6px; align-items:center;">
    <div style="background: #ffd400; padding: 8px; border-radius: 16px;"><img src="../assets/logo-icon-mono-dark.svg" width="84" height="84"/></div>
    <div class="pp-fine" style="color: var(--pp-fg-3);">MONO DARK ON YELLOW</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:6px; align-items:center;">
    <img src="../assets/logo-icon.svg" width="48" height="48"/>
    <div class="pp-fine" style="color: var(--pp-fg-3);">FAVICON · 48px</div>
  </div>
</div>
<div class="meta">Bracket [•] containing a marble. Profile-pic safe, watermark safe. SVG + PNG export at 1024×1024.</div>
</body></html>
