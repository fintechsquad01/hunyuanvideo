<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Archetype backgrounds</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background: var(--pp-bg); color: var(--pp-fg); font-family: var(--pp-ff-body); }
  body { padding: 20px; box-sizing: border-box; }
  .row { display:flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .col { display:flex; flex-direction: column; gap: 14px; }
  .meta { font: 500 11px/1.2 var(--pp-ff-num); color: var(--pp-fg-3); margin-top: 6px; letter-spacing: 0.04em; }
  .label { font: 500 10px/1 var(--pp-ff-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--pp-fg-3); margin-bottom: 6px; }
</style>
</head>
<body>

<div class="row" style="gap: 10px;">
  
    <div style="flex:1; display:flex; flex-direction:column; gap: 6px;">
      <div style="height: 200px; background: url('../assets/bg-pitch.svg') center/cover; border-radius: 8px; border: 1px solid var(--pp-line);"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">PITCH</div>
      <div class="pp-fine" style="color: var(--pp-fg-3);">Plinko engines</div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap: 6px;">
      <div style="height: 200px; background: url('../assets/bg-arena.svg') center/cover; border-radius: 8px; border: 1px solid var(--pp-line);"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">ARENA</div>
      <div class="pp-fine" style="color: var(--pp-fg-3);">Ring expansion</div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap: 6px;">
      <div style="height: 200px; background: url('../assets/bg-chart.svg') center/cover; border-radius: 8px; border: 1px solid var(--pp-line);"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">CHART</div>
      <div class="pp-fine" style="color: var(--pp-fg-3);">League table race</div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap: 6px;">
      <div style="height: 200px; background: url('../assets/bg-track.svg') center/cover; border-radius: 8px; border: 1px solid var(--pp-line);"></div>
      <div class="pp-fine" style="color: var(--pp-fg-2);">TRACK</div>
      <div class="pp-fine" style="color: var(--pp-fg-3);">Score race</div>
    </div>
  
</div>
</body></html>
